name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # One runner, because the floor and the newest are the same thing today: every
        # consuming app is on macOS 26, so the package declares 26 and macos-latest is 26.
        #
        # There were two. The floor runner was macos-15 and it existed to catch an API
        # newer than the floor allowed — which it did, correctly, from 1.2.0 onward: it
        # failed on SupportKitMenuBar's `.buttonStyle(.glass)`. Nobody was reading it, so
        # the signal was noise and the test job simply did not run for three releases.
        #
        # Put the pinned runner back the day macos-latest moves past 26, and pin it to 26
        # rather than to whatever the oldest consumer happens to be.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  # A gate rather than a suggestion: --strict turns every lint finding into a failure.
  # One runner only, and the newest one, because --strict on two swift-format versions fails
  # whenever they disagree about a file neither author nor reviewer touched.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: xcrun swift-format lint --strict --recursive Package.swift Sources Tests
